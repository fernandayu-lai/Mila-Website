<!DOCTYPE html>

<head>
    <title>Contact</title>
</head>
<style>
    body {
        background-color: #ffe9ff;
        color: #4b3326;
        font-family: Georgia, 'Times New Roman', Times, serif;
        text-align: center;
        margin: 0;
    }

    h1 {
        background-color: #ffe9ff;
        color: #4b3326;
        font-family: Georgia, serif;
        padding: 30px;
    }
    img {
        width: 380px;
        border-radius: 15px;
      }
    h2 {
        color: #4b3326;
    }

    p {
        font-size: 18px;
        line-height: 1.6;
    }
    nav {
    background-color: #ffe9ff;
    padding: 15px;
}

nav a {
    color: #4b3326;
    text-decoration: none;
    margin: 12px;
    font-weight: bold;
}

nav a:hover {
    color: #4b3326;
}

        form {
            background-color: #fff5fc;
            padding: 25px;
            border-radius: 15px;
            width: 300px;
            max-width: 85%;
            margin: 20px auto;
        }

        input, textarea {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border: 1px solid #d6a5c4;
            border-radius: 8px;
            font-family: Georgia, serif;
        }

        button {
            background-color: #d6a5c4;
            color: #4b3326;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c58bad;
        }
    </style>
</head>

<body>

    <h1>Contact Mila</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Mila</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>

    <h2>Send Me a Message!</h2>

    <p>Want to say hello?
       Leave me a message below!</p>

    <form id="contactForm">

        <label for="name">Your Name:</label>
        <input type="text" id="name" required>

        <label for="message">Your Message:</label>
        <textarea id="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>

    </form>

    <h2>Website Created By</h2>
    <p>Fernanda Yu Lai</p>

    <script>
        document.getElementById("contactForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                alert("Thank you for your message!");
            });
    </script>

</body>
</html>
